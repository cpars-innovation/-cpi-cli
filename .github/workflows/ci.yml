name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./... && go vet -tags integration ./...

      # Offline tests against an in-memory mock tenant; also checks that
      # docs/commands.md and docs/examples are up to date.
      - name: test
        run: go test -race ./...

      # Cross-package coverage of the offline suite; fails below the floor
      - name: coverage
        run: |
          go test -coverpkg=./... -coverprofile=coverage.out ./... > /dev/null
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 50) }' || (echo "coverage below 50%" && exit 1)

      - name: build
        run: make build && ./bin/cpictl --version
